# Deploys the chat backend (Cloudflare Worker) whenever its code or the site data changes.
# Requires two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers KV Storage:Edit)
# and CLOUDFLARE_ACCOUNT_ID. Without them the deploy step is skipped, so the Pages deploy is unaffected.
# The OPENAI_API_KEY secret is stored on the worker itself: npm run worker:secret
name: Deploy chat worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - "chat/**"
      - "src/**"
      - "tests/**"
      - "tsconfig.json"
      - "scripts/**"
      - "package.json"
      - "data/**"
      - "wrangler.toml"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: "chat-worker"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets are not configured; skipping worker deploy."
