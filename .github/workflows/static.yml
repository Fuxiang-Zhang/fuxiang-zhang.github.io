name: Deploy terminal and reading modes to Pages

on:
  push:
    branches: ["main", "reading-mode"]
  workflow_dispatch:

permissions:
  contents: read

# Both branches publish one complete site, using the same deployment queue.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reading homepage
        uses: actions/checkout@v5
        with:
          ref: reading-mode
          path: reading
          persist-credentials: false
      - name: Checkout terminal homepage
        uses: actions/checkout@v5
        with:
          ref: main
          path: terminal
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: terminal/package-lock.json
      - name: Install terminal homepage dependencies
        working-directory: terminal
        run: npm ci
      - name: Check, test and build terminal homepage
        working-directory: terminal
        run: |
          npm run check
          npm test
      - name: Assemble complete site
        run: |
          mkdir -p _site
          cp -a terminal/dist/. _site/
          mkdir -p _site/reading
          rsync -a --exclude='/.git/' --exclude='/.github/' reading/ _site/reading/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/vibe/index.html
          test -f _site/reading/index.html
          test -f _site/data/site.md
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
