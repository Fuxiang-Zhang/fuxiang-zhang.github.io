<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Fuxiang Zhang’s research in large language models, reinforcement learning, and multi-agent systems. Publications, background, and a conversational research assistant.">
  <meta name="theme-color" content="#fafafa">
  <meta property="og:title" content="Fuxiang Zhang — Research Terminal">
  <meta property="og:description" content="Large language models. Reinforcement learning. Multi-agent systems. Explore the research and the person behind it.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/Photo.JPG">
  <meta name="twitter:card" content="summary">
  <title>Fuxiang Zhang - Homepage</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/maple-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell" id="app-shell">
    <header class="terminal-bar"><a href="#bio" data-command="/bio">Fuxiang Zhang - Homepage</a><span><button id="theme-toggle" aria-label="Switch color theme">[dark]</button></span></header>
    <main class="main" id="main" tabindex="-1">
      <div class="scroll-area" id="scroll-area">
        <div class="content" id="content"><div id="messages" class="messages" aria-label="Terminal output"></div></div>
      </div>
        <div class="composer-region"><div class="composer-wrap">
          <section class="command-menu" id="command-menu" aria-label="Command suggestions" hidden>
            <div class="command-menu-heading"><span>commands</span><button type="button" id="close-commands" aria-label="Close commands">[esc]</button></div>
            <div id="command-options" role="listbox" aria-label="Commands"></div>
            <p class="command-menu-note">↑↓ select · Tab complete · Enter run</p>
          </section>
          <div class="context-chip" id="context-chip" hidden></div>
          <p class="command-error" id="command-error" role="status" hidden></p>
          <p class="budget-notice" id="budget-notice" role="status" hidden></p>
          <form class="composer" id="chat-form">
            <label for="message" class="sr-only">Your question or command</label>
            <span class="input-prompt" aria-hidden="true">›</span>
            <textarea id="message" rows="1" maxlength="2000" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Type /help or ask a question…" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="command-options" aria-describedby="composer-hint"></textarea>
            <button type="submit" class="send-button" id="send-button" aria-label="Send message" disabled>[enter]</button>
          </form>
          <div class="composer-hint" id="composer-hint"><button type="button" data-command="/help">/help</button> · <span>Type anywhere · Shift+Enter newline</span></div>
        </div></div>
    </main>
    <footer class="status-bar"><span id="terminal-status">ready</span><span id="chat-mode">chat: simulated</span></footer>
  </div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">This conversational view needs JavaScript. Please enable it to browse the homepage.</div></noscript>
</body>
</html>
